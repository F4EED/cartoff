<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Documentation — Cartoff</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #222;
      background: #e8eaf6;
      min-height: 100vh;
    }
    .layout {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #c5cae9;
      box-shadow: 2px 0 6px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 16px 14px 12px;
      border-bottom: 1px solid #e8eaf6;
    }
    .sidebar-header h1 {
      margin: 0 0 4px;
      font-size: 17px;
      color: #3949ab;
    }
    .sidebar-header a.back {
      font-size: 13px;
      color: #3949ab;
      text-decoration: none;
    }
    .sidebar-header a.back:hover { text-decoration: underline; }
    .nav {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px 16px;
    }
    .nav button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 9px 12px;
      margin-bottom: 4px;
      font-size: 14px;
      font-family: Arial, sans-serif;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      color: #333;
    }
    .nav button:hover {
      background: #f5f5f5;
      border-color: #e8eaf6;
    }
    .nav button.active {
      background: #3949ab;
      color: #fff;
      border-color: #303f9f;
    }
    .main {
      flex: 1;
      min-width: 0;
      padding: 20px 20px 40px;
    }
    .content {
      max-width: 860px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      padding: 28px 32px;
    }
    .content img { max-width: 100%; height: auto; border-radius: 4px; }
    .content h1, .content h2, .content h3 { color: #3949ab; margin-top: 1.4em; }
    .content h1 { margin-top: 0; font-size: 1.8em; }
    .content a { color: #303f9f; }
    .content a[data-doc] { cursor: pointer; }
    .content blockquote {
      margin: 1em 0;
      padding: 0.5em 1em;
      border-left: 4px solid #3949ab;
      background: #f5f5f5;
      color: #444;
    }
    .content pre {
      background: #263238;
      color: #eceff1;
      padding: 12px 14px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
    }
    .content code {
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.92em;
    }
    .content :not(pre) > code {
      background: #f0f0f0;
      padding: 2px 5px;
      border-radius: 3px;
    }
    .content table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
      font-size: 14px;
    }
    .content th, .content td {
      border: 1px solid #ccc;
      padding: 8px 10px;
      text-align: left;
    }
    .content th { background: #e8eaf6; }
    .content hr { border: none; border-top: 1px solid #ccc; margin: 1.5em 0; }
    .status {
      padding: 20px 24px;
      border-radius: 8px;
      background: #fff3e0;
      border: 1px solid #ffb74d;
      color: #5d4037;
    }
    .status.error { background: #ffebee; border-color: #ef9a9a; color: #b71c1c; }
    .status code { background: #fff; padding: 2px 6px; border-radius: 3px; }
    .loading { color: #666; font-style: italic; }
    @media (max-width: 720px) {
      .layout { flex-direction: column; }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #c5cae9;
      }
      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 8px;
      }
      .nav button {
        width: auto;
        flex: 1 1 auto;
        margin-bottom: 0;
      }
      .content { padding: 18px 16px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Documentation</h1>
        <a class="back" href="index.html">← Retour à la carte</a>
      </div>
      <nav class="nav" id="docNav" aria-label="Documents"></nav>
    </aside>

    <main class="main">
      <article class="content" id="docContent">
        <p class="loading">Chargement…</p>
      </article>
    </main>
  </div>

  <script src="js/marked.min.js"></script>
  <script>
    const DOCS = [
      { file: 'README.md', label: 'Présentation' },
      { file: 'SAR.md', label: 'Missions SAR' },
      { file: 'sources.md', label: 'Sources & données' },
      { file: 'pmtiles/README.md', label: 'Fond PMTiles' },
      { file: 'elevation/README.md', label: 'Altitude (MNT)' },
      { file: 'pmtiles/tools/README.md', label: 'Outil PMTiles (CLI)' }
    ];

    const DOC_SET = new Set(DOCS.map((d) => d.file));
    const DOC_LABELS = Object.fromEntries(DOCS.map((d) => [d.file, d.label]));

    let currentDoc = 'README.md';
    let pendingHash = '';

    const contentEl = document.getElementById('docContent');
    const navEl = document.getElementById('docNav');

    DOCS.forEach((doc) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.doc = doc.file;
      btn.textContent = doc.label;
      btn.addEventListener('click', () => loadDoc(doc.file));
      navEl.appendChild(btn);
    });

    const navButtons = navEl.querySelectorAll('button');

    function isFileProtocol() {
      return window.location.protocol === 'file:';
    }

    function baseDir(file) {
      const i = file.lastIndexOf('/');
      return i >= 0 ? file.slice(0, i + 1) : '';
    }

    function normalizePath(path) {
      const parts = path.split('/');
      const out = [];
      for (const part of parts) {
        if (!part || part === '.') continue;
        if (part === '..') {
          if (out.length) out.pop();
          continue;
        }
        out.push(part);
      }
      return out.join('/');
    }

    function resolveRelativeUrl(href, base) {
      if (!href || /^(https?:|mailto:|tel:)/i.test(href)) return href;
      if (href.startsWith('/')) return href;
      const hashIdx = href.indexOf('#');
      const pathPart = hashIdx >= 0 ? href.slice(0, hashIdx) : href;
      const hashPart = hashIdx >= 0 ? href.slice(hashIdx) : '';
      if (!pathPart) return hashPart || href;
      const resolved = normalizePath(base + pathPart);
      return resolved + hashPart;
    }

    function docFromHref(href) {
      if (!href || /^(https?:|mailto:|tel:|#)/i.test(href)) return null;
      const hashIdx = href.indexOf('#');
      const pathPart = hashIdx >= 0 ? href.slice(0, hashIdx) : href;
      const hashPart = hashIdx >= 0 ? href.slice(hashIdx) : '';
      if (!pathPart) return null;
      const normalized = normalizePath(pathPart);
      if (DOC_SET.has(normalized)) return { file: normalized, hash: hashPart };
      if (DOC_SET.has(pathPart)) return { file: pathPart, hash: hashPart };
      return null;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderMarkdown(md, docFile) {
      const base = baseDir(docFile);
      const html = marked.parse(md, { gfm: true, breaks: false });
      const wrap = document.createElement('div');
      wrap.innerHTML = html;

      wrap.querySelectorAll('img[src]').forEach((img) => {
        const src = img.getAttribute('src');
        if (src && !/^(https?:|data:|\/)/i.test(src)) {
          img.setAttribute('src', resolveRelativeUrl(src, base));
        }
      });

      wrap.querySelectorAll('a[href]').forEach((a) => {
        const href = a.getAttribute('href');
        if (!href) return;
        const internal = docFromHref(resolveRelativeUrl(href, base));
        if (internal) {
          a.setAttribute('href', '#');
          a.setAttribute('data-doc', internal.file);
          if (internal.hash) a.setAttribute('data-hash', internal.hash);
          return;
        }
        if (!/^(https?:|mailto:|tel:|#|\/)/i.test(href)) {
          a.setAttribute('href', resolveRelativeUrl(href, base));
        }
      });

      return wrap.innerHTML;
    }

    function showFileProtocolHelp() {
      contentEl.innerHTML =
        '<div class="status error">' +
        '<p><strong>Impossible de charger la documentation en mode fichier local (<code>file://</code>).</strong></p>' +
        '<p>Les navigateurs bloquent le chargement des fichiers Markdown via <code>fetch</code> sans serveur HTTP.</p>' +
        '<p>Utilisez le serveur local Cartoff :</p>' +
        '<ol>' +
        '<li>Lancez <code>start.bat</code> (Windows) ou <code>python serve.py -p 8000</code></li>' +
        '<li>Ouvrez <a href="http://localhost:8000/">http://localhost:8000/</a></li>' +
        '<li>Cliquez sur <strong>Documentation</strong> dans le panneau latéral</li>' +
        '</ol></div>';
    }

    function scrollToHash(hash) {
      if (!hash) return;
      const id = decodeURIComponent(hash.replace(/^#/, ''));
      const target = document.getElementById(id)
        || document.querySelector('[id="' + CSS.escape(id) + '"]')
        || document.querySelector('a[name="' + CSS.escape(id) + '"]');
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function setActiveNav(filename) {
      navButtons.forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.doc === filename);
      });
    }

    async function loadDoc(filename, hash) {
      currentDoc = filename;
      pendingHash = hash || '';
      setActiveNav(filename);
      document.title = 'Documentation — ' + (DOC_LABELS[filename] || filename);
      history.replaceState(null, '', '#doc=' + encodeURIComponent(filename) + (pendingHash || ''));

      if (isFileProtocol()) {
        showFileProtocolHelp();
        return;
      }

      contentEl.innerHTML = '<p class="loading">Chargement de ' + escapeHtml(filename) + '…</p>';

      try {
        const res = await fetch(filename);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const md = await res.text();
        contentEl.innerHTML = renderMarkdown(md, filename);
        if (pendingHash) {
          requestAnimationFrame(() => scrollToHash(pendingHash));
          pendingHash = '';
        }
      } catch (err) {
        contentEl.innerHTML =
          '<div class="status error">' +
          '<p><strong>Échec du chargement de <code>' + escapeHtml(filename) + '</code></strong></p>' +
          '<p>' + escapeHtml(err.message || err) + '</p>' +
          '<p>Vérifiez que vous utilisez <code>http://localhost:8000/docs.html</code> ' +
          '(via <code>start.bat</code> ou <code>python serve.py</code>), pas un fichier ouvert directement.</p>' +
          '</div>';
      }
    }

    contentEl.addEventListener('click', (e) => {
      const link = e.target.closest('a[data-doc]');
      if (!link) return;
      e.preventDefault();
      loadDoc(link.dataset.doc, link.dataset.hash || '');
    });

    function initFromLocation() {
      const hash = location.hash || '';
      const match = hash.match(/^#doc=([^&]+)/);
      if (match) {
        const raw = decodeURIComponent(match[1]);
        const hashIdx = raw.indexOf('#');
        const file = hashIdx >= 0 ? raw.slice(0, hashIdx) : raw;
        const frag = hashIdx >= 0 ? raw.slice(hashIdx) : '';
        if (DOC_SET.has(file)) {
          loadDoc(file, frag);
          return;
        }
      }
      loadDoc('README.md');
    }

    initFromLocation();
  </script>
</body>
</html>
